<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pizza tracker · Luigi’s</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>:focus-visible{outline:3px solid #162d82;outline-offset:3px}.btn{min-height:44px}.progress{height:1.5rem}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><script src="/tracker.js" defer></script></head>
<body><main class="container py-5" style="max-width:850px"><h1>Track your pizza</h1><p id="tracker-order"></p><div class="card card-body"><p id="tracker-message" role="status" aria-live="polite">Loading order…</p><div class="progress mb-3" id="tracker-progress" role="progressbar" aria-label="Pizza preparation stage" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1"><div id="tracker-fill" class="progress-bar bg-success" style="width:20%"></div></div><ol id="tracker-stages" class="list-group list-group-numbered mb-3"></ol><p id="tracker-estimate">Awaiting kitchen confirmation…</p><div class="d-flex gap-2 flex-wrap"><button type="button" class="btn btn-primary" id="tracker-refresh">Refresh status</button><button type="button" class="btn btn-outline-secondary" id="tracker-pause" aria-pressed="false">Pause automatic updates</button><a href="/" class="btn btn-outline-secondary">Home</a></div></div></main></body></html>
