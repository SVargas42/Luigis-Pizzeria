<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luigi’s staff desk</title>
<style>body{font:16px system-ui;background:#fbf7ef;color:#292720;margin:0;padding:24px}main{max-width:1150px;margin:auto}h1{color:#a92d25}button,input,select{font:inherit;padding:10px;border:1px solid #756d61;border-radius:6px}button{cursor:pointer;background:#fff}article{background:white;border:1px solid #ddd;padding:20px;border-radius:12px;margin:15px 0}table{border-collapse:collapse;width:100%;background:white}td,th{text-align:left;padding:12px;border-bottom:1px solid #ddd}.scroll{overflow:auto}#message{color:#85221d}a{color:#85221d}</style>
<main><h1>Luigi’s staff desk</h1><p>Pickup orders · Payment collected at pickup</p><button id="refresh">Refresh orders</button> <a href="/">Customer ordering</a><p id="message" role="status"></p><section id="orders" aria-label="Order queue"></section><h2>Customer directory</h2><form id="search"><label for="query">Search by email or last name</label> <input id="query" maxlength="100"><button>Search</button></form><p>Most recent 100 matching customers. Customer information is for fulfilling orders.</p><div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Order value</th><th>Last order</th></tr></thead><tbody id="customers"></tbody></table></div></main>
<script>
const $=id=>document.getElementById(id),money=n=>'$'+(Number(n)/100).toFixed(2);
async function api(path,options){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw Error(data.error);return data}
const transitions={received:['preparing','cancelled'],preparing:['ready','cancelled'],ready:['completed','cancelled'],completed:[],cancelled:[]};
async function refresh(){try{const orders=await api('/api/admin/orders');$('orders').replaceChildren();for(const o of orders){const card=document.createElement('article'),title=document.createElement('h2'),detail=document.createElement('p'),list=document.createElement('ul');title.textContent=`LP-${o.id} · ${o.status} · ${money(o.total_cents)}`;detail.textContent=`${o.customer_name} · ${o.customer_email} · ${o.customer_phone || 'No phone'} · ${new Date(o.created_at).toLocaleString()}`;for(const i of o.items){const li=document.createElement('li');li.textContent=`${i.quantity} × ${i.description}`;list.append(li)}card.append(title,detail,list);for(const status of transitions[o.status]){const b=document.createElement('button');b.textContent='Mark '+status;b.onclick=async()=>{b.disabled=true;try{await api('/api/admin/orders/'+o.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await refresh()}catch(e){$('message').textContent=e.message;b.disabled=false}};card.append(b,document.createTextNode(' '))}$('orders').append(card)}if(!orders.length)$('orders').textContent='No orders yet.';$('message').textContent='Queue updated. Showing latest 100 orders.'}catch(e){$('message').textContent=e.message}}
async function customers(){try{const rows=await api('/api/admin/customers?q='+encodeURIComponent($('query').value));$('customers').replaceChildren();for(const c of rows){const row=document.createElement('tr');for(const value of [`${c.first_name} ${c.last_name}`,c.email,c.phone,c.order_count,money(c.total_cents),c.last_order?new Date(c.last_order).toLocaleString():'—']){const td=document.createElement('td');td.textContent=value;row.append(td)}$('customers').append(row)}}catch(e){$('message').textContent=e.message}}
$('refresh').onclick=refresh;$('search').onsubmit=e=>{e.preventDefault();customers()};refresh();customers();
</script></html>
